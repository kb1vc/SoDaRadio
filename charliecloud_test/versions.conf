# SoDaRadio supported-distro list.
#
# This is the single source of truth for which Fedora and Ubuntu releases
# the project builds and tests against.  Both the local charliecloud scripts
# (build-fedora.sh, build-ubuntu.sh, test-install-*.sh) and the GitHub
# Actions release workflow (.github/workflows/release.yml) read this file.
#
# To bump supported versions:
#   1. Edit the two lines below.
#   2. Commit.
#   Nothing else needs to change.
#
# Convention: list oldest first and newest last.  The local scripts default
# to the *last* entry in each list when no FEDORA_VERSION / UBUNTU_VERSION
# is supplied by the user.

FEDORA_VERSIONS="44 45"
UBUNTU_VERSIONS="24.04 26.04"
